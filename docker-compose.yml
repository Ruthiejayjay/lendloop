services:
  n8n:
    image: n8nio/n8n:latest
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_BASE_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=UTC
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL:-}
      - N8N_HMAC_SECRET=${N8N_HMAC_SECRET:-}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: